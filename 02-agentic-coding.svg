    <!-- Step 01: Plan -->
    <g transform="translate(20, 40)">
      <rect width="120" height="60" rx="8" fill="#181d20" stroke="#86e8da" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="1;0.25;0.25;0.25;1" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="12" y="22" fill="#86e8da" font-family="'Courier New', monospace" font-size="10.5" font-weight="700">01 plan</text>
      <text x="12" y="43" fill="#f0f2f0" font-family="'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700">rg · Context</text>
    </g>

    <!-- Step 02: Build -->
    <g transform="translate(152, 40)">
      <rect width="120" height="60" rx="8" fill="#181d20" stroke="#85bcf5" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="0.25;1;0.25;0.25;0.25" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="12" y="22" fill="#85bcf5" font-family="'Courier New', monospace" font-size="10.5" font-weight="700">02 build</text>
      <text x="12" y="43" fill="#f0f2f0" font-family="'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700">apply_patch</text>
    </g>

    <!-- Step 03: Review -->
    <g transform="translate(284, 40)">
      <rect width="120" height="60" rx="8" fill="#181d20" stroke="#c5a0f0" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="0.25;0.25;1;0.25;0.25" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="12" y="22" fill="#c5a0f0" font-family="'Courier New', monospace" font-size="10.5" font-weight="700">03 review</text>
      <text x="12" y="43" fill="#f0f2f0" font-family="'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700">AST &amp; Diff</text>
    </g>

    <!-- Step 04: Verify -->
    <g transform="translate(416, 40)">
      <rect width="120" height="60" rx="8" fill="#181d20" stroke="#e8bd75" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="0.25;0.25;0.25;1;0.25" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="12" y="22" fill="#e8bd75" font-family="'Courier New', monospace" font-size="10.5" font-weight="700">04 verify</text>
      <text x="12" y="43" fill="#f0f2f0" font-family="'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700">Test &amp; Ship</text>
    </g>
  </g>

  <!-- Right Card: Live CLIProxyAPI & Argon Telemetry Stream -->
  <g transform="translate(612, 168)">
    <rect width="556" height="118" rx="14" fill="#101315" stroke="#2a3134" stroke-width="1.2"/>
    <circle cx="24" cy="22" r="4" fill="#36f5ed">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="26" fill="#86e8da" font-family="'Courier New', monospace" font-size="11" font-weight="700">
