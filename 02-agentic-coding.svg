    </text>
    <text x="536" y="26" text-anchor="end" fill="#e8bd75" font-family="'Courier New', monospace" font-size="10.5" font-weight="700">
      THINKING: HIGH
    </text>

    <rect x="18" y="36" width="520" height="66" rx="8" fill="#090b0d" stroke="#2a3134" stroke-width="1"/>
    <text x="30" y="56" fill="#a2aaa9" font-family="'Courier New', monospace" font-size="11" font-weight="700">
      <tspan fill="#85bcf5">[codex-mcp]</tspan> tools: apply_patch, exec_command, github, cua_repl
    </text>
    <text x="30" y="74" fill="#a2aaa9" font-family="'Courier New', monospace" font-size="11" font-weight="700">
      <tspan fill="#e8bd75">[proxy:8317]</tspan> route /v1/chat/completions -&gt; <tspan fill="#c5a0f0">gemini-4-argon-high</tspan>
    </text>
    <text x="30" y="92" fill="#a2aaa9" font-family="'Courier New', monospace" font-size="11" font-weight="700">
      <tspan fill="#86e8da">[image:8317]</tspan> modal=[text,image] -&gt; <tspan fill="#f19cb8">gemini-3.1-flash-image</tspan> ✓
    </text>
  </g>
</svg>
