  <!-- Container -->
  <rect width="1200" height="284" rx="16" fill="url(#bg02)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="282.5" rx="15.25" fill="none" stroke="#2a3134" stroke-width="1.5"/>

  <!-- Section Kicker: 02 AFTER HOURS / PERSONAL PROJECTS -->
  <g transform="translate(32, 32)">
    <circle cx="6" cy="-4" r="3.5" fill="#e8bd75">
