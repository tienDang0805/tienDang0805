      <stop offset="0%" stop-color="#090b0d"/>
      <stop offset="100%" stop-color="#0d1113"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="1200" height="184" rx="16" fill="url(#bg04)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="182.5" rx="15.25" fill="none" stroke="#2a3134" stroke-width="1.5"/>

  <!-- Section Kicker: 04 CONTACT / READY TO CONNECT -->
  <g transform="translate(32, 32)">
    <circle cx="6" cy="-4" r="3.5" fill="#86e8da">
