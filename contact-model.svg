<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 176" width="100%" height="100%">
  <defs>
    <radialGradient id="blueGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#85bcf5" stop-opacity="0.13"/>
      <stop offset="75%" stop-color="#101315" stop-opacity="0"/>
    </radialGradient>
    <marker id="blueArrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L6 4L1 7" fill="none" stroke="#85bcf5" stroke-width="1.2"/>
    </marker>
    <filter id="blueHalo">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Connection Model for Section 04 (Single Dominant Color: Sky Blue #85bcf5) -->
  <rect width="1000" height="176" rx="10" fill="#101315" stroke="#2a3134" stroke-width="1.2"/>
  <rect x="1" y="38" width="998" height="137" fill="url(#blueGlow)"/>
  <line x1="0" y1="38" x2="1000" y2="38" stroke="#2a3134" stroke-width="1"/>

  <!-- Top Bar -->
  <circle cx="20" cy="19" r="3" fill="#85bcf5">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="32" y="23" fill="#a2aaa9" font-family="'Courier New', monospace" font-size="10" font-weight="700" letter-spacing="0.6">
    04 // DIRECT CHANNELS · HO CHI MINH CITY, VIETNAM
  </text>
  <text x="980" y="23" text-anchor="end" fill="#85bcf5" font-family="'Courier New', monospace" font-size="10" font-weight="700">
    OPEN FOR COLLABORATION
  </text>

  <!-- Connecting Wires (y=102) -->
  <path d="M215 102H295" stroke="#85bcf5" stroke-opacity="0.65" stroke-width="1.6" marker-end="url(#blueArrow)"/>
  <path d="M465 102H545" stroke="#85bcf5" stroke-opacity="0.65" stroke-width="1.6" marker-end="url(#blueArrow)"/>
  <path d="M715 102H795" stroke="#85bcf5" stroke-opacity="0.65" stroke-width="1.6" marker-end="url(#blueArrow)"/>

  <!-- Animated Signal Packet -->
  <circle r="6" cy="102" fill="#85bcf5" opacity="0.55" filter="url(#blueHalo)">
    <animate attributeName="cx" values="130;380;630;880" dur="5.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.5" cy="102" fill="#f0f2f0">
    <animate attributeName="cx" values="130;380;630;880" dur="5.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 01 Portfolio (Highlighted) -->
  <g transform="translate(45, 66)">
    <rect width="170" height="72" rx="7" fill="#122233" stroke="#85bcf5" stroke-width="1.4"/>
    <text x="10" y="15" fill="#85bcf5" font-family="'Courier New', monospace" font-size="8">01</text>
    <text x="85" y="40" text-anchor="middle" fill="#f0f2f0" font-family="'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700">Portfolio</text>
    <text x="85" y="57" text-anchor="middle" fill="#85bcf5" font-family="'Courier New', monospace" font-size="8" font-weight="700" letter-spacing="0.4">DEVTIENDANG.BLOG</text>
  </g>

  <!-- 02 Direct Email -->
  <g transform="translate(295, 66)">
    <rect width="170" height="72" rx="7" fill="#090b0d" stroke="#2a3134" stroke-width="1.2"/>
    <text x="10" y="15" fill="#a2aaa9" font-family="'Courier New', monospace" font-size="8" opacity="0.6">02</text>
    <text x="85" y="40" text-anchor="middle" fill="#f0f2f0" font-family="'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700">Direct Email</text>
    <text x="85" y="57" text-anchor="middle" fill="#a2aaa9" font-family="'Courier New', monospace" font-size="8" letter-spacing="0.4">DVTIEN8599@GMAIL</text>
  </g>

  <!-- 03 LinkedIn -->
  <g transform="translate(545, 66)">
    <rect width="170" height="72" rx="7" fill="#090b0d" stroke="#2a3134" stroke-width="1.2"/>
    <text x="10" y="15" fill="#a2aaa9" font-family="'Courier New', monospace" font-size="8" opacity="0.6">03</text>
    <text x="85" y="40" text-anchor="middle" fill="#f0f2f0" font-family="'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700">LinkedIn</text>
    <text x="85" y="57" text-anchor="middle" fill="#a2aaa9" font-family="'Courier New', monospace" font-size="8" letter-spacing="0.4">PROFESSIONAL NET</text>
  </g>

  <!-- 04 Facebook -->
  <g transform="translate(795, 66)">
    <rect width="160" height="72" rx="7" fill="#090b0d" stroke="#2a3134" stroke-width="1.2"/>
    <text x="10" y="15" fill="#a2aaa9" font-family="'Courier New', monospace" font-size="8" opacity="0.6">04</text>
    <text x="80" y="40" text-anchor="middle" fill="#f0f2f0" font-family="'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700">Facebook</text>
    <text x="80" y="57" text-anchor="middle" fill="#a2aaa9" font-family="'Courier New', monospace" font-size="8" letter-spacing="0.4">FB.COM/DVTIEN8599</text>
  </g>
</svg>
