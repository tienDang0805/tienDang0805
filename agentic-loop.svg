<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <radialGradient id="loopGlow" cx="32%" cy="52%" r="45%">
      <stop offset="0%" stop-color="#c5a0f0" stop-opacity="0.14"/>
      <stop offset="75%" stop-color="#101315" stop-opacity="0"/>
    </radialGradient>
    <filter id="dotGlow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <path id="stadiumLoop" d="M140 86 H460 C555 86 555 246 460 246 H140 C45 246 45 86 140 86 Z"/>
  </defs>

  <!-- Outer Frame matching .agentic-panel on devtiendang.blog (Single Dominant Color: Purple #c5a0f0) -->
  <rect width="1000" height="320" rx="12" fill="#101315" stroke="#2a3134" stroke-width="1.2"/>
  <rect width="600" height="320" rx="12" fill="url(#loopGlow)"/>
  <line x1="600" y1="0" x2="600" y2="320" stroke="#2a3134" stroke-width="1"/>

  <!-- LEFT PANEL (600x320): Exact Stadium Loop from AgenticCodingFlow.tsx -->
  <circle cx="24" cy="24" r="3" fill="#c5a0f0"/>
  <text x="36" y="28" fill="#a2aaa9" font-family="'Courier New', monospace" font-size="10" font-weight="700" letter-spacing="0.8">
    02 // AGENTIC CODING FLOW
  </text>
  <rect x="506" y="13" width="70" height="22" rx="4" fill="#090b0d" stroke="#2a3134" stroke-width="1"/>
  <text x="541" y="28" text-anchor="middle" fill="#c5a0f0" font-family="'Courier New', monospace" font-size="9.5">Auto loop</text>

  <!-- Stadium Loop Track & 4 Segments -->
  <use href="#stadiumLoop" fill="none" stroke="#2a3134" stroke-width="1.8"/>
  <path d="M140 86H460" fill="none" stroke="#c5a0f0" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.85;0.15;0.15;0.15;0.85" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M460 86C555 86 555 246 460 246" fill="none" stroke="#c5a0f0" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.15;0.85;0.15;0.15;0.15" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M460 246H140" fill="none" stroke="#c5a0f0" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.15;0.15;0.85;0.15;0.15" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M140 246C45 246 45 86 140 86" fill="none" stroke="#c5a0f0" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.15;0.15;0.15;0.85;0.15" dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- Orbiting Glowing Dot along the Stadium Track -->
  <circle r="9" fill="#c5a0f0" opacity="0.65" filter="url(#dotGlow)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M140 86 H460 C555 86 555 246 460 246 H140 C45 246 45 86 140 86 Z"/>
  </circle>
  <circle r="4" fill="#c5a0f0">
    <animateMotion dur="8s" repeatCount="indefinite" path="M140 86 H460 C555 86 555 246 460 246 H140 C45 246 45 86 140 86 Z"/>
  </circle>

  <!-- Center Core Label -->
  <text x="300" y="158" text-anchor="middle" fill="#a2aaa9" font-family="'Courier New', monospace" font-size="10" font-weight="700" letter-spacing="1.4">
    ANTIGRAVITY / CODEX
  </text>
  <line x1="286" y1="166" x2="314" y2="166" stroke="#c5a0f0" stroke-opacity="0.4" stroke-width="1"/>
  <text x="300" y="180" text-anchor="middle" fill="#a2aaa9" font-family="'Courier New', monospace" font-size="9" opacity="0.65">
    context -&gt; artifact -&gt; feedback
  </text>

  <!-- Node 01: plan (140, 86) -->
  <g transform="translate(76, 62)">
    <rect width="128" height="48" rx="8" fill="#090b0d" stroke="#2a3134" stroke-width="1.3">
      <animate attributeName="stroke" values="#c5a0f0;#2a3134;#2a3134;#2a3134;#c5a0f0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#1b1526;#090b0d;#090b0d;#090b0d;#1b1526" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="8" y="14" fill="#a2aaa9" font-family="'Courier New', monospace" font-size="8.5" opacity="0.6">01</text>
    <text x="64" y="31" text-anchor="middle" fill="#f0f2f0" font-family="'Courier New', monospace" font-size="17" font-weight="700">plan</text>
    <text x="114" y="29" text-anchor="end" fill="#c5a0f0" font-family="'Courier New', monospace" font-size="12">·</text>
  </g>

  <!-- Node 02: build (460, 86) -->
  <g transform="translate(396, 62)">
    <rect width="128" height="48" rx="8" fill="#090b0d" stroke="#2a3134" stroke-width="1.3">
      <animate attributeName="stroke" values="#2a3134;#c5a0f0;#2a3134;#2a3134;#2a3134" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#090b0d;#1b1526;#090b0d;#090b0d;#090b0d" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="8" y="14" fill="#a2aaa9" font-family="'Courier New', monospace" font-size="8.5" opacity="0.6">02</text>
    <text x="64" y="31" text-anchor="middle" fill="#f0f2f0" font-family="'Courier New', monospace" font-size="17" font-weight="700">build</text>
    <text x="114" y="29" text-anchor="end" fill="#c5a0f0" font-family="'Courier New', monospace" font-size="12">·</text>
  </g>

  <!-- Node 03: review (460, 246) -->
  <g transform="translate(396, 222)">
    <rect width="128" height="48" rx="8" fill="#090b0d" stroke="#2a3134" stroke-width="1.3">
      <animate attributeName="stroke" values="#2a3134;#2a3134;#c5a0f0;#2a3134;#2a3134" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#090b0d;#090b0d;#1b1526;#090b0d;#090b0d" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="8" y="14" fill="#a2aaa9" font-family="'Courier New', monospace" font-size="8.5" opacity="0.6">03</text>
    <text x="64" y="31" text-anchor="middle" fill="#f0f2f0" font-family="'Courier New', monospace" font-size="17" font-weight="700">review</text>
    <text x="114" y="29" text-anchor="end" fill="#c5a0f0" font-family="'Courier New', monospace" font-size="12">·</text>
  </g>

  <!-- Node 04: verify (140, 246) -->
  <g transform="translate(76, 222)">
    <rect width="128" height="48" rx="8" fill="#090b0d" stroke="#2a3134" stroke-width="1.3">
      <animate attributeName="stroke" values="#2a3134;#2a3134;#2a3134;#c5a0f0;#2a3134" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#090b0d;#090b0d;#090b0d;#1b1526;#090b0d" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="8" y="14" fill="#a2aaa9" font-family="'Courier New', monospace" font-size="8.5" opacity="0.6">04</text>
    <text x="64" y="31" text-anchor="middle" fill="#f0f2f0" font-family="'Courier New', monospace" font-size="17" font-weight="700">verify</text>
    <text x="114" y="29" text-anchor="end" fill="#c5a0f0" font-family="'Courier New', monospace" font-size="12">·</text>
  </g>

  <text x="300" y="302" text-anchor="middle" fill="#a2aaa9" font-family="'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11.5">
    Plan -&gt; code -&gt; review -&gt; test. Repeat when needed.
  </text>

  <!-- RIGHT PANEL (400x320): Inspector matching .agentic-inspector on devtiendang.blog -->
  <g transform="translate(600, 0)">
    <rect x="1" y="1" width="398" height="318" rx="11" fill="#090b0d"/>
    <text x="28" y="34" fill="#c5a0f0" font-family="'Courier New', monospace" font-size="11" font-weight="700">01 — 04 // WORKFLOW ARTIFACT</text>
    <text x="28" y="72" fill="#f0f2f0" font-family="'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700">
      Plan, build &amp; verify
    </text>
    <text x="28" y="100" fill="#a2aaa9" font-family="'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12.5">
      <tspan x="28" dy="0">Read the existing code, implement small</tspan>
      <tspan x="28" dy="20">verifiable steps, inspect diffs &amp; run checks.</tspan>
    </text>

    <!-- Code Artifact Box -->
    <rect x="28" y="138" width="344" height="132" rx="6" fill="#101315" stroke="#2a3134" stroke-width="1"/>
    <line x1="28" y1="168" x2="372" y2="168" stroke="#2a3134" stroke-width="1"/>
    <text x="42" y="157" fill="#a2aaa9" font-family="'Courier New', monospace" font-size="10">implementation.diff</text>
    <text x="358" y="157" text-anchor="end" fill="#a2aaa9" font-family="'Courier New', monospace" font-size="8.5" opacity="0.6">EXAMPLE</text>

    <text x="42" y="192" fill="#c5a0f0" font-family="'Courier New', monospace" font-size="10.5">
      <tspan x="42" dy="0">→ 01 plan:   read codebase &amp; define scope</tspan>
      <tspan x="42" dy="20">+ 02 build:  apply_patch &amp; small diffs</tspan>
      <tspan x="42" dy="20">□ 03 review: check logic &amp; edge cases</tspan>
      <tspan x="42" dy="20">↺ 04 verify: run tests &amp; inspect UI</tspan>
    </text>

    <text x="28" y="298" fill="#a2aaa9" font-family="'Courier New', monospace" font-size="10">devtiendang.blog/#agentic-flow</text>
    <text x="372" y="298" text-anchor="end" fill="#c5a0f0" font-family="'Courier New', monospace" font-size="11">↗</text>
  </g>
</svg>
